<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register</title>
    <!-- Using Tailwind CDN for immediate styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style>
        /* اعمال گرادینت پس‌زمینه */
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        /* اعمال افکت شیشه‌ای روی کانتینر فرم */
        .glass-form {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }

        /* بهبود رنگ متن هدر */
        .text-indigo-800-custom {
            color: #2c3e50;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        /* رنگ متن لینک ورود برای هماهنگی با پس‌زمینه روشن */
        .login-link-white {
            color: white !important;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }
        .login-link-white:hover {
            color: #e0e0e0 !important;
        }
    </style>
    <!-- *********************************************** -->
</head>
<body class="flex items-center justify-center min-h-screen">

<div class="glass-form p-8 rounded-lg w-full max-w-md border-t-4 border-purple-600">
    <h1 class="text-3xl font-bold mb-6 text-center text-indigo-800-custom">ثبت نام</h1>

    <form th:action="@{/users/register}" method="post" class="space-y-5">
        <!-- CSRF Token (Assuming Thymeleaf environment) -->
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <!-- Username Field -->
        <div>
            <label class="block mb-1 font-medium text-gray-700" for="username">نام کاربری</label>
            <input class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition duration-150"
                   type="text" name="username" id="username"
                   th:value="${registerDto != null} ? ${registerDto.username} : ''" required />
        </div>

        <!-- Email Field -->
        <div>
            <label class="block mb-1 font-medium text-gray-700" for="email">ایمیل</label>
            <input class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition duration-150"
                   type="text" name="email" id="email"
                   th:value="${registerDto != null} ? ${registerDto.email} : ''" required />
        </div>

        <!-- Full Name Field -->
        <div>
            <label class="block mb-1 font-medium text-gray-700" for="fullName">نام کامل</label>
            <input class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition duration-150"
                   type="text" name="fullName" id="fullName"
                   th:value="${registerDto != null} ? ${registerDto.fullName} : ''" required />
        </div>

        <!-- Password Field -->
        <div>
            <label class="block mb-1 font-medium text-gray-700" for="password">گذرواژه</label>
            <input class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition duration-150"
                   type="password" name="password" id="password" required />
        </div>

        <!-- Re-Password Field -->
        <div>
            <label class="block mb-1 font-medium text-gray-700" for="rePassword">تکرار گذرواژه</label>
            <input class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition duration-150"
                   type="password" name="rePassword" id="rePassword" required />
        </div>

        <!-- Submit Button: تغییر رنگ به گرادینت نارنجی/قرمز -->
        <button type="submit"
                class="w-full text-white py-3 rounded-lg font-semibold text-lg transition duration-300 shadow-lg shadow-orange-500/50
                           bg-gradient-to-r from-orange-500 to-red-500 hover:from-orange-600 hover:to-red-600">
            ثبت نام
        </button>
    </form>

    <p class="mt-6 text-center text-gray-600">
        اکانت دارید؟
        <!-- لینک ورود با کلاس سفید تغییر یافت -->
        <a href="login.html" class="hover:underline font-medium login-link-white">ورود</a>
    </p>
</div>
</body>
</html>
